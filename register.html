<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BudgetFlow - Register</title>

    <link rel="stylesheet" href="register.css">

</head>


<body>

    <div class="page-container">


        <!-- Logo -->

        <header class="logo-section">
            <h1>
                <span>Budget</span><span>Flow</span>
            </h1>

            <p>
                Steering Your Finances as One ...
            </p>

        </header>


        <!-- Registration -->

        <main class="register-container">


            <!-- Image -->

            <div class="image-box">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRK-WddXY2PVQXoNPID8iSVXR1ydyr45ATtW-p8VSFIhxs8Y7neaX5o0P4&s=10"
                    alt="Financial Planning"
                >

            </div>


            <!-- Form -->

            <div class="register-box">

                <div class="form-heading">

                    <h2>Register</h2>

                    <span></span>

                </div>


                <form id="registerForm">

                    <input
                        type="text"
                        id="username"
                        placeholder="Username"
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                    >

                    <button
                        type="submit"
                        class="register-btn"
                    >
                        Register
                    </button>

                </form>


                <div class="login-link">

                    <span>Already have an account?</span>

                    <button
                        type="button"
                        id="loginButton"
                    >
                        Login
                    </button>

                </div>

            </div>

        </main>

    </div>


    <script src="register.js"></script>

</body>
</html>
