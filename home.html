<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BudgetFlow - Expense Tracker</title>

    <link rel="stylesheet" href="home.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<div class="dashboard">


    <!-- ================= TOP BAR ================= -->

    <header class="top-bar">

        <h3>
            <i class="bi bi-person-fill"></i>

            Welcome <span id="welcomeUser"></span>
        </h3>

        <div class="top-actions">
            <button id="resetButton" class="reset-btn-top">
                Clear All
                <i class="bi bi-eraser-fill"></i>
            </button>
            <button id="logoutButton" class="logout-btn">
                Logout
                <i class="bi bi-power"></i>
            </button>
        </div>

    </header>


    <!-- ================= TITLE ================= -->

    <section class="title-section">
        <h1>
            <span>Budget</span><span>Flow</span>
        </h1>

        <hr>

    </section>


    <!-- ================= BALANCE CARDS ================= -->

    <section class="summary-container">


        <div class="summary-card balance-card">

            <h2>Current Balance</h2>

            <p>
                Rs <span id="balance">0</span>/-
            </p>

        </div>


        <div class="summary-card expense-card">

            <h2>Total Expense</h2>

            <p>
                Rs <span id="expense">0</span>/-
            </p>

        </div>


    </section>


    <!-- ================= INPUT SECTION ================= -->

    <section class="transaction-container">


        <!-- INCOME -->

        <div class="transaction-box income-box">

            <h2>Add Income</h2>

            <hr>


            <select id="incomeType">

                <option value="">Select Income Type</option>

                <option value="Salary">Salary</option>

                <option value="Business">Business</option>

                <option value="Freelance">Freelance</option>

                <option value="Bonus">Bonus</option>

                <option value="Gift">Gift</option>

                <option value="Other">Other</option>

            </select>


            <input
                type="number"
                id="incomeAmount"
                placeholder="Enter Income Amount"
                min="1"
            >


            <button
                id="addIncomeButton"
                class="income-btn"
            >
                Add Income
            </button>

        </div>


        <!-- EXPENSE -->

        <div class="transaction-box expense-box">

            <h2>Add Expense</h2>

            <hr>


            <select id="expenseType">

                <option value="">Select Expense Type</option>

                <option value="Food">Food</option>

                <option value="Travel">Travel</option>

                <option value="Shopping">Shopping</option>

                <option value="Bills">Bills</option>

                <option value="Entertainment">Entertainment</option>

                <option value="Education">Education</option>

                <option value="Health">Health</option>

                <option value="Other">Other</option>

            </select>


            <input
                type="number"
                id="expenseAmount"
                placeholder="Enter Expense Amount"
                min="1"
            >


            <button
                id="addExpenseButton"
                class="expense-btn"
            >
                Add Expense
            </button>

        </div>


    </section>



    <!-- ================= DETAILS ================= -->

    <section class="details-section">

        <h2>Income and Expense Details</h2>

        <hr>


        <div class="tables-container">


            <!-- INCOME TABLE -->

            <div class="table-box">

                <h3>Income</h3>

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>Type</th>

                                <th>Amount</th>

                                <th>Balance</th>

                            </tr>

                        </thead>

                        <tbody id="incomeTableBody">

                        </tbody>

                    </table>

                </div>

            </div>


            <!-- EXPENSE TABLE -->

            <div class="table-box">

                <h3>Expense</h3>

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>Type</th>

                                <th>Amount</th>

                                <th>Balance</th>

                            </tr>

                        </thead>

                        <tbody id="expenseTableBody">

                        </tbody>

                    </table>

                </div>

            </div>


        </div>

    </section>


    <!-- ================= PIE CHART ================= -->

    <section class="chart-section">

        <h2>Expense Pie-Chart</h2>

        <button
            id="chartButton"
            class="chart-btn"
        >
            Show Pie-Chart
        </button>


        <div class="chart-container">

            <canvas id="expenseChart"></canvas>

        </div>

    </section>


</div>


<script src="home.js"></script>

</body>

</html>
