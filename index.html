<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BudgetFlow - Login</title>

    <link rel="stylesheet" href="login.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <div class="page-container">

        <!-- Logo -->
        <header class="logo-section">
            <h1>
                <span>Budget</span><span>Flow</span>
            </h1>

            <p>Steering Your Finances as One ...</p>
        </header>


        <!-- Login Section -->
        <main class="login-container">

            <!-- Left Image -->
            <div class="image-box">
                <img
                    src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExMndobG96YTE5b2syNWU3NWJ5aDlwYXptM3diMGxtbWF1NnVjamJxOCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cJFQJzZxFMhONxDTnt/giphy.gif"
                    alt="Budget Illustration"
                >
            </div>


            <!-- Right Login Form -->
            <div class="login-box">

                <div class="form-heading">
                    <h2>Login</h2>
                    <span></span>
                </div>

                <hr>

                <form id="loginForm">

                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Username"
                    >

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                    >

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </form>


                <div class="register-link">

                    <span>New user?</span>

                    <button
                        type="button"
                        id="registerButton"
                    >
                        Register
                    </button>

                </div>

            </div>

        </main>

    </div>


    <script src="./login.js"></script>

</body>
</html>
